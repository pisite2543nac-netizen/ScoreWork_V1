async function flush(){
  if(!Q.length)return;
  if(!navigator.onLine){setSync('✗ ออฟไลน์ (รอส่งเมื่อมีเน็ต)',1);return}
  const b=Q.slice(),sc=b.filter(x=>x.t=='s').map(x=>x.r),cf=b.filter(x=>x.t=='c').map(x=>x.r);
  try{
    if(sc.length){const{error}=await sb.from('scores').upsert(sc,{onConflict:'task_id,student_id'});if(error)throw error}
    if(cf.length){const{error}=await sb.from('confirmations').upsert(cf,{onConflict:'offering_id,student_id'});if(error)throw error}
    Q=Q.filter(x=>!b.includes(x));saveQ();
    lastSync=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});setSync('☁️ บันทึกแล้ว '+lastSync);

}

async function all(t){let r=[],i=0;for(;;){const{data,error}=await sb.from(t).select('*').range(i,i+999);if(error)throw error;r=r.concat(data);if(data.length<1000)return r;i+=1000}}
async function load(){

    sc.forEach(r=>DB.scores[r.task_id+'|'+r.student_id]=r.score);
    cf.forEach(r=>DB.conf[r.offering_id+'|'+r.student_id]=r);
    try{localStorage.setItem('cache',JSON.stringify(DB))}catch(_){}
  }catch(x){
    const c=localStorage.getItem('cache');if(c){DB=JSON.parse(c);setSync('✗ ใช้ข้อมูลสำรองในเครื่อง: '+errMsg(x),1)}else throw x}

  $('#out').hidden=true;$('#who').textContent='';
  $('#app').innerHTML=`<div class="card login"><h2 style="margin:0">เข้าสู่ระบบ</h2><input id="em" type="email" placeholder="อีเมลครู" autocomplete="username"><input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"><button id="go">เข้าสู่ระบบ</button><div class="err" id="lm">${e(msg||'')}</div></div>`;
  const go=async()=>{$('#lm').textContent='กำลังตรวจสอบ...';const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#lm').textContent=/Invalid/i.test(error.message)?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':errMsg(error)};
  $('#go').onclick=go;$('#pw').onkeydown=ev=>{if(ev.key=='Enter')go()};
}
$('#out').onclick=async()=>{await sb.auth.signOut()};
sb.auth.onAuthStateChange((ev,ses)=>{
  if(ses){user=ses.user;if(ev=='SIGNED_IN'||ev=='INITIAL_SESSION')start()}else{user=null;loginView()}});
async function start(){
  $('#out').hidden=false;$('#who').textContent=user.email;$('#app').innerHTML='<p>กำลังโหลดข้อมูล...</p>';
  try{await load();render()}catch(x){$('#app').innerHTML=`<div class="card err">${e(errMsg(x))}<br>หากยังไม่ได้รัน schema.sql ให้รันใน Supabase SQL Editor ก่อน</div>`}
}

// ===== หน้าหลัก =====
function render(){
  const opts=DB.offerings.slice().sort((a,b)=>a.subject_code.localeCompare(b.subject_code)||rooms(a).join().localeCompare(rooms(b).join()));
  const lab=o=>`${o.subject_code} ${o.subject_name} · ห้อง ${rooms(o).map(c=>`${gname(c)} (${c})`).join(' + ')} (${rooms(o).reduce((a,c)=>a+studs(c).length,0)} คน)`;
  if(view=='off'&&!DB.offerings.find(o=>o.id==curO))view='sum';
  let h=`<div class="card noprint"><div class="row"><select id="sel" style="flex:1;min-width:220px"><option value="sum">📊 สรุปรวมทุกวิชา</option><option value="stu">👥 จัดการนักศึกษา</option>${opts.map(o=>`<option value="${o.id}">${e(lab(o))}</option>`).join('')}</select><button class="s" id="rf">🔄 รีเฟรชข้อมูล</button><button class="s" id="bk">สำรอง JSON</button></div></div>`;
  if(!DB.offerings.length)h+=`<div class="card"><p>ยังไม่มีข้อมูล กดเพื่อสร้างกลุ่มเรียน วิชา และรายชื่อนักศึกษาตั้งต้น</p><button id="seed">นำเข้ารายชื่อตั้งต้น</button></div>`;
  h+='<div id="body"></div>';$('#app').innerHTML=h;
  $('#sel').value=view=='off'?curO:view;
  $('#sel').onchange=ev=>{const v=ev.target.value;if(v=='sum'||v=='stu')view=v;else{view='off';curO=v;flt='all'}render()};
  $('#rf').onclick=async()=>{setSync('⏳ กำลังโหลด');try{await load();setSync('☁️ โหลดแล้ว');render()}catch(x){setSync('✗ '+errMsg(x),1)}};
  $('#bk').onclick=()=>dl('backup.json',JSON.stringify(DB),'application/json');
  const sd=$('#seed');if(sd)sd.onclick=seed;
  if(view=='sum')sumView();else if(view=='stu')stuView();else offView();
}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
async function seed(){
  $('#seed').disabled=true;$('#seed').textContent='กำลังนำเข้า...';
  try{
    let r=await sb.from('groups').upsert(Object.entries(ROOMS).map(([code,room_name])=>({code,room_name:room_name||null})),{onConflict:'owner_id,code'});if(r.error)throw r.error;
    const st=[];for(const g in D)D[g].split('|').forEach(l=>{const i=l.indexOf(' ');st.push({student_code:g.slice(0,8)+l.slice(0,i),full_name:l.slice(i+1),group_code:g})});
    r=await sb.from('students').upsert(st,{onConflict:'owner_id,student_code'});if(r.error)throw r.error;
    r=await sb.from('offerings').insert(O.map(o=>({subject_code:o[0],subject_name:o[1]}))).select();if(r.error)throw r.error;
    const ids=r.data.sort((a,b)=>a.created_at<b.created_at?-1:1);
    const map={};ids.forEach((x,i)=>map[i]=x.id);
    // เรียงตามลำดับ insert ไม่รับประกัน จึงจับคู่ด้วยรหัสวิชา+ลำดับ
    const used={},og=[];
    O.forEach(o=>{const cand=r.data.filter(x=>x.subject_code==o[0]&&x.subject_name==o[1]&&!used[x.id])[0];used[cand.id]=1;o[2].forEach(g=>og.push({offering_id:cand.id,group_code:String(g)}))});
    r=await sb.from('offering_groups').insert(og);if(r.error)throw r.error;
    await load();render();
  }catch(x){alert(errMsg(x));$('#seed').disabled=false}
}

// ===== สรุปรวม =====
function sumView(){
  let h='<div class="card"><h3 style="margin-top:0">สรุปรวมทุกวิชา</h3><div class="wrap"><table><tr><th class="l">วิชา</th><th class="l">ห้อง</th><th>นักศึกษา</th><th>รายการ</th><th>กรอกแล้ว</th><th>ยืนยันแล้ว</th><th>เฉลี่ย %</th><th>เกรดเฉลี่ย</th><th>ผ่าน</th><th>ไม่ผ่าน</th></tr>';
  DB.offerings.slice().sort((a,b)=>a.subject_code.localeCompare(b.subject_code)).forEach(o=>rooms(o).forEach(c=>{
    const ss=studs(c),cs=ss.map(s=>calc(o,s)).filter(x=>x.any),k=ss.filter(s=>isConf(o,s)).length;
    const av=cs.length?cs.reduce((a,x)=>a+x.pct,0)/cs.length:null,gp=cs.length?cs.reduce((a,x)=>a+x.gr,0)/cs.length:null,ps=cs.filter(x=>x.gr>0).length;
    h+=`<tr><td class="l"><a href="#" data-o="${o.id}">${e(o.subject_code+' '+o.subject_name)}</a></td><td class="l">${e(gname(c))} (${c})</td><td>${ss.length}</td><td>${tasksOf(o).length}</td><td>${cs.length}</td><td>${k}</td><td>${av==null?'-':n2(av)}</td><td>${gp==null?'-':n2(gp)}</td><td>${ps}</td><td>${cs.length-ps}</td></tr>`}));
  $('#body').innerHTML=h+'</table></div></div>';
  document.querySelectorAll('[data-o]').forEach(a=>a.onclick=ev=>{ev.preventDefault();view='off';curO=a.dataset.o;flt='all';render()});
}

// ===== จัดการนักศึกษา =====
function stuView(){
  const gs=DB.groups.slice().sort((a,b)=>a.code.localeCompare(b.code));
  let h=`<div class="card noprint"><div class="row"><input id="nc" placeholder="รหัส 11 หลัก" inputmode="numeric"><input id="nn" placeholder="ชื่อ-นามสกุล" style="flex:1"><select id="ng">${gs.map(g=>`<option value="${g.code}">${e(gname(g.code))} (${g.code})</option>`).join('')}</select><button id="na">เพิ่ม</button></div></div>`;
  gs.forEach(g=>{const ss=studs(g.code);h+=`<div class="card"><b>${e(gname(g.code))} (${g.code}) · ${ss.length} คน</b>${ss.map((s,i)=>`<div class="row" style="margin:4px 0"><span style="min-width:30px">${i+1}</span><span class="mut" style="min-width:100px">${s.student_code}</span><span style="flex:1">${e(s.full_name)}</span><button class="s" data-ed="${s.id}">✏️</button><button class="d" data-dl="${s.id}">🗑</button></div>`).join('')}</div>`});
  $('#body').innerHTML=h;
  $('#na').onclick=async()=>{const c=$('#nc').value.trim(),n=$('#nn').value.trim();if(!c||!n)return alert('กรอกรหัสและชื่อ');const{error}=await sb.from('students').insert({student_code:c,full_name:n,group_code:$('#ng').value});if(error)return alert(errMsg(error));await load();render()};
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{const s=DB.students.find(x=>x.id==b.dataset.ed),n=prompt('แก้ชื่อ',s.full_name);if(!n)return;const{error}=await sb.from('students').update({full_name:n.trim()}).eq('id',s.id);if(error)return alert(errMsg(error));s.full_name=n.trim();render()});
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const s=DB.students.find(x=>x.id==b.dataset.dl);if(!confirm('ลบ '+s.full_name+' (คะแนนของคนนี้จะหายด้วย)?'))return;const{error}=await sb.from('students').delete().eq('id',s.id);if(error)return alert(errMsg(error));await load();render()});
}

// ===== หน้าวิชา =====
function offView(){
  const o=DB.offerings.find(x=>x.id==curO),rs=rooms(o),ts=tasksOf(o),gs=flt=='all'?rs:[flt];
  const mx=ts.reduce((a,t)=>a+ +t.max_score,0);
  let h=`<div class="card noprint"><div class="row"><b style="flex:1">${e(o.subject_code+' '+o.subject_name)}</b><label>แสดงกลุ่ม <select id="fl"><option value="all">ทั้งหมด</option>${rs.map(c=>`<option value="${c}">${e(gname(c))} (${c})</option>`).join('')}</select></label></div>
  <details><summary><b>รายการคะแนน/งาน</b> · คะแนนเต็มรวม ${n2(mx)}</summary><div id="tl" style="margin-top:8px">${ts.map(t=>`<div class="row"><input data-tn="${t.id}" value="${e(t.name)}" style="flex:1;min-width:140px"><input data-tm="${t.id}" type="number" min="0" step="any" value="${t.max_score}" style="width:90px"><button class="d" data-td="${t.id}">ลบ</button></div>`).join('')}</div>
  <div class="row"><input id="tnn" placeholder="ชื่องานใหม่" style="flex:1;min-width:140px"><input id="tnm" type="number" value="10" style="width:90px"><button id="tadd">+ เพิ่มรายการ</button><button class="s" id="tcp">คัดลอกรายการคะแนนไปทุกห้อง</button></div></details></div>
  <div class="card noprint"><div class="stats" id="st"></div></div>
  <div class="card"><div class="row noprint"><button id="sa">บันทึกทั้งหมด</button><button class="s" id="csv">ส่งออก CSV</button><button class="s" onclick="print()">🖨 พิมพ์</button></div><div class="wrap"><table><tr><th class="c1">ลำดับ</th><th class="c2">รหัส</th><th class="c3 l">ชื่อ-นามสกุล</th>${ts.map(t=>`<th><div class="v">${e(t.name)} (${t.max_score})</div></th>`).join('')}<th>รวม<br>(${n2(mx)})</th><th>ร้อยละ</th><th>เกรด</th><th class="noprint">สถานะ</th></tr>`;
  const cs=ts.length+7;
  gs.forEach(c=>{h+=`<tr class="band"><td colspan="${cs}">ห้อง ${e(gname(c))} (${c}) · ${studs(c).length} คน</td></tr>`;
    studs(c).forEach((s,i)=>{const k=isConf(o,s);h+=`<tr data-s="${s.id}" class="${k?'ok':''}"><td class="c1">${i+1}</td><td class="c2">${s.student_code}</td><td class="c3 l">${e(s.full_name)}</td>${ts.map(t=>{const v=DB.scores[t.id+'|'+s.id];return`<td><input type="number" inputmode="decimal" min="0" max="${t.max_score}" step="any" data-t="${t.id}" data-s="${s.id}" value="${v==null?'':v}" ${k?'disabled':''}></td>`}).join('')}<td class="tot"></td><td class="pct"></td><td class="gr"></td><td class="noprint act"></td></tr>`})});
  $('#body').innerHTML=h+'</table></div></div>';
  $('#fl').value=flt;$('#fl').onchange=ev=>{flt=ev.target.value;offView()};
  document.querySelectorAll('tr[data-s]').forEach(tr=>upd(o,tr));stats(o,gs);
  const B=$('#body');
  B.oninput=ev=>{const i=ev.target;if(!i.dataset.t)return;const t=DB.tasks.find(x=>x.id==i.dataset.t);let v=i.value===''?null:+i.value;if(v!=null&&(isNaN(v)||v<0))v=null;if(v!=null&&v>t.max_score){v=+t.max_score;i.value=v}
    DB.scores[t.id+'|'+i.dataset.s]=v;enq({k:'s'+t.id+i.dataset.s,t:'s',r:{task_id:t.id,student_id:i.dataset.s,score:v}});upd(o,i.closest('tr'));stats(o,gs)};
  B.onclick=ev=>{const b=ev.target.closest('[data-sv],[data-ed]');if(!b)return;const sid=b.dataset.sv||b.dataset.ed;setConf(o,sid,!!b.dataset.sv);offView()};
  $('#sa').onclick=()=>{let n=0;gs.forEach(c=>studs(c).forEach(s=>{if(!isConf(o,s)&&calc(o,s).any){setConf(o,s.id,true);n++}}));if(!n)alert('ไม่มีรายการที่ต้องบันทึก');offView()};
  $('#csv').onclick=()=>{const q=x=>'"'+String(x).replace(/"/g,'""')+'"';let r=[['ห้อง/กลุ่ม','ลำดับ','รหัส','ชื่อ',...ts.map(t=>t.name+' ('+t.max_score+')'),'รวม','ร้อยละ','เกรด','สถานะ']];
    gs.forEach(c=>studs(c).forEach((s,i)=>{const x=calc(o,s);r.push([gname(c)+' ('+c+')',i+1,s.student_code,s.full_name,...ts.map(t=>DB.scores[t.id+'|'+s.id]??''),x.any?n2(x.tot):'',x.any?n2(x.pct):'',x.any?x.gr:'',isConf(o,s)?'บันทึกแล้ว':'ยังไม่ยืนยัน'])}));
    dl(o.subject_code+'.csv','\ufeff'+r.map(a=>a.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
  // รายการคะแนน
  document.querySelectorAll('[data-tn],[data-tm]').forEach(i=>i.onchange=()=>tEdit(o,i));
  document.querySelectorAll('[data-td]').forEach(b=>b.onclick=async()=>{if(!confirm('ลบรายการนี้และคะแนนทั้งหมดของรายการ?'))return;const{error}=await sb.from('tasks').delete().eq('id',b.dataset.td);if(error)return alert(errMsg(error));await load();offView()});
  $('#tadd').onclick=async()=>{const n=$('#tnn').value.trim();if(!n)return alert('ใส่ชื่องาน');const{error}=await sb.from('tasks').insert({offering_id:o.id,name:n,max_score:+$('#tnm').value||10,sort_order:ts.length});if(error)return alert(errMsg(error));await load();offView()};
  $('#tcp').onclick=async()=>{if(!ts.length||!confirm('คัดลอกรายการคะแนนไปทุกห้อง/วิชาอื่น (ข้ามรายการที่ชื่อและคะแนนเต็มซ้ำ)?'))return;
    const rows=[];DB.offerings.filter(x=>x.id!=o.id).forEach(x=>{const ex=tasksOf(x);ts.forEach(t=>{if(!ex.some(y=>y.name==t.name&&+y.max_score==+t.max_score))rows.push({offering_id:x.id,name:t.name,max_score:t.max_score,sort_order:ex.length+rows.filter(r=>r.offering_id==x.id).length})})});
    if(!rows.length)return alert('ทุกห้องมีรายการครบแล้ว');const{error}=await sb.from('tasks').insert(rows);if(error)return alert(errMsg(error));await load();offView();alert('คัดลอก '+rows.length+' รายการ')};
}
async function tEdit(o,i){
  const id=i.dataset.tn||i.dataset.tm,t=DB.tasks.find(x=>x.id==id),p={};
  if(i.dataset.tn)p.name=i.value.trim();else{p.max_score=Math.max(0,+i.value||0)}
  const{error}=await sb.from('tasks').update(p).eq('id',id);if(error)return alert(errMsg(error));
  Object.assign(t,p);
  if(p.max_score!=null){const fix=[];DB.students.forEach(s=>{const k=id+'|'+s.id,v=DB.scores[k];if(v!=null&&v>p.max_score){DB.scores[k]=p.max_score;fix.push({task_id:id,student_id:s.id,score:p.max_score})}});
    if(fix.length){const r=await sb.from('scores').upsert(fix,{onConflict:'task_id,student_id'});if(r.error)alert(errMsg(r.error))}}
  offView();
}
function setConf(o,sid,on){const r={offering_id:o.id,student_id:sid,confirmed:on,confirmed_at:on?new Date().toISOString():null};DB.conf[o.id+'|'+sid]=r;enq({k:'c'+o.id+sid,t:'c',r});flush()}
function upd(o,tr){
  const s=DB.students.find(x=>x.id==tr.dataset.s),x=calc(o,s),k=isConf(o,s),c=DB.conf[o.id+'|'+s.id];
  tr.querySelector('.tot').textContent=x.any?n2(x.tot):'';tr.querySelector('.pct').textContent=x.any?n2(x.pct):'';tr.querySelector('.gr').textContent=x.any?x.gr:'';
  tr.querySelector('.act').innerHTML=k?`<span class="tag">✓ บันทึกแล้ว ${c.confirmed_at?new Date(c.confirmed_at).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span> <button class="s" data-ed="${s.id}">✏️ แก้ไข</button>`:`<button data-sv="${s.id}" ${x.any?'':'disabled'}>💾 บันทึก</button>`;
}
function stats(o,gs){
  const ss=gs.flatMap(studs),cs=ss.map(s=>calc(o,s)).filter(x=>x.any),mx=tasksOf(o).reduce((a,t)=>a+ +t.max_score,0);
  const avg=cs.length?cs.reduce((a,x)=>a+x.tot,0)/cs.length:null,gp=cs.length?cs.reduce((a,x)=>a+x.gr,0)/cs.length:null;
  const it=(b,l)=>`<div><b>${b}</b><span>${l}</span></div>`;
  $('#st').innerHTML=it(ss.length,'นักศึกษา')+it(ss.filter(s=>isConf(o,s)).length+'/'+ss.length,'ยืนยันแล้ว')+it(n2(mx),'คะแนนเต็มรวม')+it(avg==null?'-':n2(avg),'ค่าเฉลี่ย')+it(gp==null?'-':n2(gp),'เกรดเฉลี่ย')+it(cs.length?n2(Math.max(...cs.map(x=>x.tot))):'-','สูงสุด')+it(cs.length?n2(Math.min(...cs.map(x=>x.tot))):'-','ต่ำสุด');
}
loginView();
</script></body></html>
